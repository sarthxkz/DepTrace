# Optional: DepTrace violations in GitHub code scanning (SARIF upload).
#
# Copy to .github/workflows/deptrace-code-scanning.yml and set DEPTRACE_REPOSITORY
# and DEPTRACE_REF. It needs "security-events: write", so it runs only for pushes
# to the default branch and manual runs, never for pull requests (whose code may
# come from forks). Requires code scanning (public repositories, or GitHub
# Advanced Security). See docs/github-actions.md.

name: Architecture code scanning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  DEPTRACE_REPOSITORY: your-org/deptrace
  DEPTRACE_REF: 0000000000000000000000000000000000000000
  NODE_VERSION: '24'
  DEPTRACE_DIRECTORY: .

jobs:
  sarif:
    name: Upload SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Needed by upload-sarif to read workflow run information in private repositories.
      actions: read
    steps:
      - name: Validate settings
        run: |
          if ! [[ "$DEPTRACE_REF" =~ ^[0-9a-f]{40}$ ]] || [ "$DEPTRACE_REF" = 0000000000000000000000000000000000000000 ]; then
            echo "::error::Set DEPTRACE_REF to the full commit SHA of the DepTrace version to use."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out DepTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEPTRACE_REPOSITORY }}
          ref: ${{ env.DEPTRACE_REF }}
          path: .deptrace-tool
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .deptrace-tool/package-lock.json

      - name: Build DepTrace
        run: |
          mv .deptrace-tool "$RUNNER_TEMP/deptrace-tool"
          cd "$RUNNER_TEMP/deptrace-tool"
          npm ci --ignore-scripts
          npm run build

      - name: Write SARIF
        run: |
          set +e
          node "$RUNNER_TEMP/deptrace-tool/dist/index.js" check "$DEPTRACE_DIRECTORY" --sarif "$RUNNER_TEMP/deptrace.sarif"
          code=$?
          set -e
          # Violations (3) are what code scanning shows; any other failure is real.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/deptrace.sarif
          category: deptrace
