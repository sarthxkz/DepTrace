<!doctype html>
<html><head><meta charset="utf-8"><title>Category standard</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font:14px/1.45 system-ui,sans-serif;color:#E6E8EB;background:#0B0D10;display:grid;grid-template-columns:240px 1fr}
nav{background:#111418;border-right:1px solid #1F242B;padding:18px 12px}
nav b{display:block;font-size:20px;padding:0 10px 18px}
nav a{display:block;padding:8px 10px;border-radius:6px}nav a.on{background:#1A2130;color:#fff}
main{padding:24px 28px;display:grid;grid-template-rows:auto auto 1fr;gap:20px}
h1{font-size:24px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.c{background:#111418;border:1px solid #1F242B;border-radius:10px;padding:16px}.c b{display:block;font-size:30px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.panel{background:#111418;border:1px solid #1F242B;border-radius:10px;padding:16px}
.panel h2{font-size:22px;margin-bottom:12px}
.bar{height:12px;background:#5B8DEF;border-radius:6px;margin:12px 0}
</style></head><body>
<nav><b>deptrace</b><a class="on">Overview</a><a>Dependency graph</a><a>Layers</a><a>Violations</a><a>Cycles</a><a>Modules</a><a>Reports</a></nav>
<main><h1>layered-shop</h1>
<div class="cards"><div class="c"><b>20</b>files</div><div class="c"><b>26</b>dependencies</div><div class="c"><b>2</b>packages</div><div class="c"><b>2</b>cycles</div><div class="c"><b>7</b>violations</div></div>
<div class="two"><div class="panel"><h2>Violations by rule</h2><div class="bar" style="width:80%"></div><div class="bar" style="width:30%"></div><div class="bar" style="width:30%"></div><div class="bar" style="width:30%"></div></div>
<div class="panel"><h2>Files per layer</h2><div class="bar" style="width:40%"></div><div class="bar" style="width:40%"></div><div class="bar" style="width:100%"></div><div class="bar" style="width:55%"></div></div></div>
</main></body></html>
