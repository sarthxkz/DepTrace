version: 1

# DepTrace analyzing and checking its own source. Test fixtures contain
# deliberate cycles, syntax errors and violations, so they are excluded.

project:
  name: 'deptrace'

analysis:
  include:
    - '**/*'
  exclude:
    - 'tests/fixtures/**'

layers:
  - name: cli
    files: ['src/index.ts', 'src/cli/**']
  - name: dashboard-server
    files: ['src/dashboard/**']
  - name: baseline
    files: ['src/baseline/**']
  - name: rules
    files: ['src/rules/**']
  - name: analysis
    files: ['src/analysis/**']
  - name: config
    files: ['src/config/**']
  # Dependency advisories; the only module that uses the network.
  - name: audit
    files: ['src/audit/**']
  - name: core
    files: ['src/core/**', 'src/utils/**']
  # The browser app talks to the analyzer only through the JSON report.
  - name: dashboard-app
    files: ['dashboard/**']

rules:
  layer-boundaries:
    severity: error
    # importer layer -> layers it may import
    allowed:
      cli: [dashboard-server, baseline, rules, analysis, config, audit, core]
      dashboard-server: [core]
      baseline: [rules, core]
      rules: [analysis, core]
      analysis: [core]
      config: [rules, core]
      audit: [core]
      core: []
      dashboard-app: []

  forbidden-packages:
    - name: fast-startup
      description: Modules loaded by every command must not load the TypeScript compiler
      severity: error
      from:
        [
          'src/index.ts',
          'src/core/**',
          'src/config/**',
          'src/baseline/**',
          'src/dashboard/**',
          'src/cli/commands/dashboard.ts',
          'src/cli/index.ts',
          'src/cli/options.ts',
        ]
      packages: ['typescript']

  circular-dependencies:
    severity: error
