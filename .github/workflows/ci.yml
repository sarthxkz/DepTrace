name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      # Third-party actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: CLI smoke tests
        run: |
          set -u
          repo="$PWD"
          cli="$repo/dist/index.js"
          node "$cli" --help
          node "$cli" --version
          node "$cli" scan .
          node "$cli" scan . --format json > "$RUNNER_TEMP/scan.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/scan.json"
          node "$cli" deps src/index.ts --direction both
          node "$cli" path src/index.ts src/cli/index.ts

          work="$RUNNER_TEMP/deptrace-smoke"
          mkdir -p "$work"
          cd "$work"
          node "$cli" init
          test -f deptrace.yml

          expect_exit() {
            local expected="$1"; shift
            set +e; node "$cli" "$@"; local code=$?; set -e
            if [ "$code" -ne "$expected" ]; then
              echo "Expected exit $expected from '$*', got $code"; exit 1
            fi
          }
          expect_exit 1 init
          expect_exit 2 scan ./does-not-exist
          expect_exit 2 bogus
          expect_exit 2 check
          expect_exit 0 report
          cd "$repo"
          expect_exit 0 check
          expect_exit 3 check tests/fixtures/layered
          expect_exit 0 report tests/fixtures/layered

          baseline="$RUNNER_TEMP/layered-baseline.json"
          expect_exit 0 baseline create tests/fixtures/layered --file "$baseline"
          expect_exit 1 baseline create tests/fixtures/layered --file "$baseline"
          expect_exit 0 check tests/fixtures/layered --baseline "$baseline"
          expect_exit 2 check tests/fixtures/layered --baseline "$RUNNER_TEMP/missing.json"
          expect_exit 3 check tests/fixtures/layered --sarif "$RUNNER_TEMP/layered.sarif"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/layered.sarif"

          # Dashboard: built assets, report with baseline statuses, bad options.
          test -f dist/dashboard/index.html
          storefront=tests/fixtures/storefront
          expect_exit 0 report "$storefront" --format json --baseline "$storefront/deptrace-baseline.json"
          expect_exit 2 dashboard --report "$RUNNER_TEMP/missing-dir" --port 0 "$storefront"
          expect_exit 2 dashboard --port 70000

  dashboard-e2e:
    name: Dashboard end-to-end (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners; no browser download.
      - run: npm run test:e2e
