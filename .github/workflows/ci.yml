name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: CLI smoke tests
        run: |
          set -u
          repo="$PWD"
          cli="$repo/dist/index.js"
          node "$cli" --help
          node "$cli" --version
          node "$cli" scan .
          node "$cli" scan . --format json > "$RUNNER_TEMP/scan.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/scan.json"
          node "$cli" deps src/index.ts --direction both
          node "$cli" path src/index.ts src/cli/index.ts

          work="$RUNNER_TEMP/deptrace-smoke"
          mkdir -p "$work"
          cd "$work"
          node "$cli" init
          test -f deptrace.yml

          expect_exit() {
            local expected="$1"; shift
            set +e; node "$cli" "$@"; local code=$?; set -e
            if [ "$code" -ne "$expected" ]; then
              echo "Expected exit $expected from '$*', got $code"; exit 1
            fi
          }
          expect_exit 1 init
          expect_exit 2 scan ./does-not-exist
          expect_exit 2 bogus
          expect_exit 2 check
          expect_exit 0 report
          cd "$repo"
          expect_exit 0 check
          expect_exit 3 check tests/fixtures/layered
          expect_exit 0 report tests/fixtures/layered
