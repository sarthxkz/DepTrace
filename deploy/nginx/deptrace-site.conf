# nginx site for the DepTrace website (static files from site/).
# Replace example.com with your domain, then follow docs/website.md.
# Start with this HTTP block; "certbot --nginx" adds HTTPS and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/deptrace;
    index index.html;

    # The site is static: no scripts, no third-party resources, no forms.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable only after HTTPS works for every name above:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        # add_header in a location replaces the server-level headers; repeat the essentials.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never serve dotfiles (e.g. a stray .git or .env).
    location ~ /\. {
        deny all;
    }
}
